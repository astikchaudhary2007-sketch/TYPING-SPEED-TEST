<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typeset — typing speed test</title>
  <meta name="description" content="A typing speed test with daily missions, login gifts and titles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead__inner">
    <a href="#test" class="brand" aria-label="Typeset home">typeset<span>.</span></a>

    <nav class="nav" aria-label="Primary">
      <a href="#test" data-nav="test"><i>01</i>Test</a>
      <a href="#missions" data-nav="missions"><i>02</i>Missions<b class="pip" id="pipMissions" hidden></b></a>
      <a href="#gifts" data-nav="gifts"><i>03</i>Gifts<b class="pip" id="pipGifts" hidden></b></a>
      <a href="#profile" data-nav="profile"><i>04</i>Profile</a>
    </nav>

    <div class="status">
      <a href="#gifts" class="status__item" title="Daily login streak">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.3 1.2c.4 2.3 3.6 3.7 3.6 7.4A3.9 3.9 0 0 1 8 12.6a3.9 3.9 0 0 1-3.9-4c0-1.8.9-2.9 1.8-3.7.2 1.3.9 2.1 1.7 2.4-.3-2-.1-4 .7-6.1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 14.6h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <strong id="hdrStreak">0</strong>
      </a>
      <a href="#gifts" class="status__item" title="Coins">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6v6.8M6.2 6.4c0-.8.8-1.3 1.8-1.3s1.8.5 1.8 1.2c0 1.7-3.6 1-3.6 2.9 0 .8.8 1.3 1.8 1.3s1.8-.5 1.8-1.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <strong id="hdrCoins">0</strong>
      </a>
      <a href="#profile" class="lvl" id="hdrLvl">
        <span class="lvl__num">Lv <strong id="hdrLevel">1</strong></span>
        <span class="lvl__bar"><span id="hdrXpBar"></span></span>
      </a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme"></button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 01 TEST -->
  <section class="view" id="view-test" data-view="test">
    <div class="testbar" id="testbar">
      <div class="seg" role="group" aria-label="Test mode">
        <button type="button" data-mode="time">time</button>
        <button type="button" data-mode="words">words</button>
        <button type="button" data-mode="passage">passage</button>
      </div>
      <span class="testbar__sep" aria-hidden="true"></span>
      <div class="seg" role="group" aria-label="Test length" id="lengthSeg"></div>
      <span class="testbar__sep" aria-hidden="true" id="extrasSep"></span>
      <div class="seg" role="group" aria-label="Extras" id="extrasSeg">
        <button type="button" data-toggle="punct">punctuation</button>
        <button type="button" data-toggle="nums">numbers</button>
      </div>
      <span class="testbar__who" id="testWho"></span>
    </div>

    <div class="typing unfocused" id="typing">
      <div class="typing__live">
        <span class="live-main" id="liveMain">30</span>
        <span class="live-sub"><span id="liveWpm">0</span> wpm</span>
        <span class="live-sub"><span id="liveAcc">100</span>% acc</span>
        <span class="live-title" id="liveTitle" hidden></span>
      </div>
      <div class="viewport" id="viewport">
        <div class="words" id="words"></div>
        <div class="caret idle" id="caret"></div>
      </div>
      <div class="pbar" id="passageBar" hidden><span></span></div>
      <div class="typing__hint" id="focusHint">Click here, or just start typing</div>
      <input id="hiddenInput" class="sr-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Typing input">
    </div>

    <div class="results" id="results" hidden></div>

    <p class="keys-hint"><kbd>tab</kbd> new test <span>/</span> <kbd>esc</kbd> repeat these words <span>/</span> <kbd>ctrl</kbd>+<kbd>backspace</kbd> clear word</p>

    <aside class="sheet" id="sheet" aria-label="Today's missions"></aside>
  </section>

  <!-- 02 MISSIONS -->
  <section class="view" id="view-missions" data-view="missions" hidden></section>

  <!-- 03 GIFTS -->
  <section class="view" id="view-gifts" data-view="gifts" hidden></section>

  <!-- 04 PROFILE -->
  <section class="view" id="view-profile" data-view="profile" hidden></section>
</main>

<footer class="colophon">
  <div class="wrap colophon__inner">
    <span>typeset<span class="accent">.</span> — a small typing press</span>
    <span>Progress is kept in this browser only.</span>
  </div>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="modal__card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
